name: Tokos DEX CI

on:
  push:
    branches:
      - main
      - tokos/1delta-integration
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck web
        run: bun run --cwd apps/web typecheck
      - name: Build web
        run: bun run --cwd apps/web build:production
