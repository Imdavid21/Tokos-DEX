name: inspect-history-once
on:
  push:
    paths:
      - '.github/workflows/inspect-history-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public history and rate movers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://tokos.fun/data' -o /tmp/page.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/page.html', encoding='utf-8').read()
          clean=lambda x: html.unescape(re.sub(r'<[^>]+>','',x))
          print('BYTES',len(s))
          print('HISTORY_EMPTY','History is accumulating' in s)
          print('HISTORY_NOTE','Representative · 8 most liquid active markets' in s)
          print('MOVERS_EMPTY','No rate changes yet' in s)
          print('PALETTE_TOKENS', all(x in s or True for x in []))
          section=s.split('Rate Movers',1)[1].split('Best Opportunities',1)[0] if 'Rate Movers' in s and 'Best Opportunities' in s else ''
          links=len(re.findall(r'href="(?:/data)?/market/',section))
          bp_values=re.findall(r'[-+]?\d[\d,.]*\s*bp',section)
          print('MOVER_LINKS',links)
          print('MOVER_BP_VALUES',bp_values[:12])
          assert 'Representative · 8 most liquid active markets' in s
          assert 'History is accumulating' not in s
          assert 'No rate changes yet' not in s
          assert links >= 1
          assert len(bp_values) >= 1
          PY
