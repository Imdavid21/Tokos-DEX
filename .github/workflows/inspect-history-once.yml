name: inspect-history-once
on:
  push:
    paths:
      - '.github/workflows/inspect-history-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect historical endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://api-v2.pendle.finance/core/v2/markets/all?limit=100&skip=0' -o /tmp/a.json
          total=$(jq -r '.total' /tmp/a.json)
          for skip in $(seq 0 100 $((total-1))); do curl -fsSL "https://api-v2.pendle.finance/core/v2/markets/all?limit=100&skip=$skip" -o "/tmp/p$skip.json"; done
          python3 - <<'PY' >/tmp/m.json
          import json,glob,datetime,time
          rows=[]
          for f in glob.glob('/tmp/p*.json'):
              rows += json.load(open(f)).get('results',[])
          now=time.time()
          def ts(s): return datetime.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()
          live=[r for r in rows if r.get('expiry') and ts(r['expiry'])>now]
          live.sort(key=lambda r:(r.get('details') or {}).get('liquidity') or 0, reverse=True)
          r=live[0]
          print(json.dumps({'chainId':r['chainId'],'address':r['address'],'name':r.get('name'),'liq':(r.get('details') or {}).get('liquidity')}))
          PY
          cat /tmp/m.json
          chain=$(jq -r '.chainId' /tmp/m.json); addr=$(jq -r '.address' /tmp/m.json)
          start=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          url="https://api-v2.pendle.finance/core/v3/$chain/markets/$addr/historical-data?time_frame=day&timestamp_start=$start&timestamp_end=$end"
          echo "$url"
          curl -fsSL "$url" -o /tmp/h.json
          jq 'keys' /tmp/h.json
          jq '.results[0:3] // .[0:3] // .' /tmp/h.json
