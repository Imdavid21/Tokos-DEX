name: inspect-pendle-once
on:
  push:
    paths:
      - '.github/workflows/inspect-pendle-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Markets HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://tokos.fun/data/markets' -o /tmp/markets.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/markets.html', encoding='utf-8').read()
          title=re.search(r'<title[^>]*>(.*?)</title>',s,re.S)
          h1=re.search(r'<h1[^>]*>(.*?)</h1>',s,re.S)
          rows=len(re.findall(r'<tbody>.*?</tbody>',s,re.S))
          market_links=len(re.findall(r'href="(?:/data)?/market/',s))
          print('TITLE', html.unescape(re.sub(r'<[^>]+>','',title.group(1))) if title else None)
          print('H1', html.unescape(re.sub(r'<[^>]+>','',h1.group(1))) if h1 else None)
          print('MARKET_LINKS', market_links)
          print('UNKNOWN', 'UNKNOWN' in s)
          print('UNAVAILABLE', 'Market analytics unavailable' in s)
          print('NO_MATCHES', 'No matching markets' in s)
          assert title and 'Markets' in title.group(1)
          assert h1 and 'Markets' in h1.group(1)
          assert market_links > 8
          assert 'UNKNOWN' not in s
          assert 'Market analytics unavailable' not in s
          assert 'No matching markets' not in s
          PY
