name: railway-cutover-smoke

on:
  push:
    paths:
      - .github/workflows/railway-cutover-smoke.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Tokos Data public and persisted API paths
        shell: bash
        run: |
          set -euo pipefail
          origin="https://tokos-data-production.up.railway.app"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$origin/data" -o /tmp/data.html
          echo "data_html_bytes=$(wc -c < /tmp/data.html)"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$origin/data/api/v1/analytics/overview?days=30" -o /tmp/overview.json
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$origin/data/api/v1/markets?limit=5" -o /tmp/markets.json
          node <<'NODE'
          const fs=require('fs');
          const overview=JSON.parse(fs.readFileSync('/tmp/overview.json','utf8'));
          const markets=JSON.parse(fs.readFileSync('/tmp/markets.json','utf8'));
          const summary=overview?.data?.summary ?? {};
          const rows=Array.isArray(markets?.data)?markets.data:[];
          console.log(JSON.stringify({
            requestId: overview?.meta?.requestId ?? null,
            stale: overview?.meta?.stale ?? null,
            asOf: overview?.meta?.asOf ?? null,
            activeMarkets: summary.activeMarkets ?? null,
            assets: summary.assets ?? null,
            protocols: summary.protocols ?? null,
            marketRowsReturned: rows.length,
            marketProviders: [...new Set(rows.map(x=>x.provider).filter(Boolean))]
          }));
          if(!overview?.meta?.requestId) throw new Error('Missing Fastify requestId');
          if(!(summary.activeMarkets > 0)) throw new Error('No persisted active markets');
          if(rows.length===0) throw new Error('No persisted market rows');
          NODE
