name: live-validation
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: live-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  providers-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg18
        env: { POSTGRES_DB: tokos_data, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tokos_data"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      APP_ENV: test
      APP_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokos_data
      REDIS_URL: redis://localhost:6379
      ONEDELTA_API_BASE_URL: https://portal.1delta.io/v1
      ONEDELTA_CHAIN_ALLOWLIST: 1,8453,42161
      PENDLE_API_BASE_URL: https://api-v2.pendle.finance/core
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4, run_install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm db:migrate
      - name: Validate live providers and normalized data
        run: pnpm --filter @tokos-data/worker validate:live
      - name: Install Chromium
        run: pnpm --filter @tokos-data/web exec playwright install --with-deps chromium
      - name: Browser, responsive, theme, and stale-state QA
        run: |
          pnpm --filter @tokos-data/api dev > /tmp/tokos-api.log 2>&1 &
          API_PID=$!
          pnpm --filter @tokos-data/web dev > /tmp/tokos-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true; echo "--- API LOG ---"; tail -200 /tmp/tokos-api.log || true; echo "--- WEB LOG ---"; tail -200 /tmp/tokos-web.log || true' EXIT
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:4000/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4000/health >/dev/null
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm --filter @tokos-data/web test:e2e --grep-invert "stale warning"
          mkdir -p qa-artifacts/visual
          cp -R apps/web/test-results/. qa-artifacts/visual/ || true
          STALE_LENDING_SECONDS=0 STALE_PENDLE_SECONDS=0 pnpm --filter @tokos-data/worker exec tsx src/mark-stale-once.ts
          STALE_BROWSER_TEST=1 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm --filter @tokos-data/web test:e2e --grep "stale warning"
          mkdir -p qa-artifacts/stale
          cp -R apps/web/test-results/. qa-artifacts/stale/ || true
      - name: Upload QA screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokos-data-qa
          path: qa-artifacts
          if-no-files-found: warn
