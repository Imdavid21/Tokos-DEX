<!DOCTYPE html>
<html translate="no">
  <head>
    <meta charset="utf-8" />

    <title>Tokos DEX</title>
    <meta name="description" content="Trade crypto with Tokos. Fast, non-custodial execution across the best available routes." />
    <meta property="og:title" content="Tokos DEX" />
    <meta property="og:description" content="Trade crypto with Tokos. Fast, non-custodial execution across the best available routes." />

    <link rel="icon" type="image/svg+xml" href="/tokos-icon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/tokos-icon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no">

    <!-- CSP will be injected here -->

    <link rel="preconnect" href="https://mainnet.infura.io/" crossorigin/>
    <link rel="preload" href="/fonts/Basel-Grotesk-Book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Basel-Grotesk-Medium.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <script id="cf-turnstile-script" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>

    <style>
      * {
        font-family: 'Basel', sans-serif;
        box-sizing: border-box;
      }

      @font-face {
        font-family: 'Basel';
        font-weight: 535;
        font-style: normal;
        font-display: block;
        src:
          url('/fonts/Basel-Grotesk-Medium.woff2') format('woff2'),
          url('/fonts/Basel-Grotesk-Medium.woff') format('woff');
      }

      @font-face {
        font-family: 'Basel';
        font-weight: 485;
        font-style: normal;
        font-display: block;
        src:
          url('/fonts/Basel-Grotesk-Book.woff2') format('woff2'),
          url('/fonts/Basel-Grotesk-Book.woff') format('woff');
      }

      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0020-007E, U+00A0-024F, U+1E00-1EFF;
        src: url('/fonts/Inter-Regular-Latin.woff2') format('woff2');
      }

      @supports (font-variation-settings: normal) {
        * {
          font-family: 'Basel', sans-serif;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(80% 60% at 50% -10%, rgba(160, 213, 133, 0.11), transparent 60%),
          #000;
      }

      @media (min-width: 768px) {
        html {
          overflow-x: hidden;
        }
      }

      button {
        user-select: none;
      }

      html {
        font-size: 16px;
        font-weight: 485;
        font-variant: none;
        font-smooth: always;
        text-rendering: optimizeLegibility !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      html,
      body,
      #root {
        min-height: 100%;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Tokos DEX.</noscript>

    <div id="root"></div>
    <div id="background-radial-gradient"></div>

    <script type="module" src="/zone-events.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
