[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/apps/**", "/packages/**", "/scripts/**", "/infra/**", "/Dockerfile", "/railway.toml", "/package.json", "/pnpm-lock.yaml", "/pnpm-workspace.yaml", "/tsconfig.base.json"]

[deploy]
preDeployCommand = ["pnpm db:migrate"]
startCommand = "pnpm start:railway:full"
healthcheckPath = "/data"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
